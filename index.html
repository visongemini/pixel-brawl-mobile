<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>像素大乱斗 - 手机版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
        }
        /* 防止移动端滚动 */
        html, body {
            position: fixed;
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        #error-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(255,0,0,0.9);
            color: #fff;
            font-size: 14px;
            padding: 10px;
            z-index: 99999;
            word-break: break-all;
            max-height: 40vh;
            overflow: auto;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
    <script>
        var errorLog = [];
        window.onerror = function(msg, url, line, col, err) {
            var el = document.getElementById('error-overlay');
            errorLog.push(line + ':' + col + ' ' + msg + ' (' + (url||'').split('/').pop() + ')');
            el.textContent = errorLog.join('\n');
            el.style.display = 'block';
        };
        window.addEventListener('unhandledrejection', function(e) {
            var el = document.getElementById('error-overlay');
            errorLog.push('Promise: ' + e.reason);
            el.textContent = errorLog.join('\n');
            el.style.display = 'block';
        });
    </script>
</head>
<body>
    <div id="error-overlay"></div>
    <div id="game-container"></div>
    
    <script src="src/data/characters.js"></script>
    <script src="src/entities/Bullet.js"></script>
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/Enemy.js"></script>
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/MenuScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/GameOverScene.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
